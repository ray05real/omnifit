# Builds Omnifit on one of GitHub's Macs every time a change is saved to GitHub, and publishes an unsigned .ipa
# (Releases on the repository's page). The sideloading app (Kravasigner) signs it with the owner's certificate.
# Same method as the owner's To Do app. The repository is public so GitHub's Mac builds and the download link are free.
name: Build the .ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the app's packages
        run: npm ci

      - name: Make the Xcode project (Expo prebuild, installs the pods)
        run: npx expo prebuild --platform ios --clean

      - name: Build (unsigned)
        run: |
          set -o pipefail
          brew install xcbeautify
          xcodebuild -workspace ios/Omnifit.xcworkspace -scheme Omnifit -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Pack the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Omnifit.app Payload/
          # The build number, so each install shows which build it is.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Payload/Omnifit.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.${{ github.run_number }}" Payload/Omnifit.app/Info.plist
          zip -qry Omnifit.ipa Payload
          ls -lh Omnifit.ipa

      - name: Publish the .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Omnifit.ipa
          make_latest: true

      - name: Publish the log of a failed build
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Last failed build's log
          prerelease: true
          files: build.log
