# Builds Omnifit on GitHub's Macs every time a change is saved to GitHub, and publishes unsigned .ipa files
# (Releases on the repository's page). The sideloading app (Kravasigner) signs them with the owner's certificate.
# Same method as the owner's To Do app. The repository is public so the Mac builds and the download links are free.
#
# Two versions are built from the same code, always together, so both stay up to date:
#   Omnifit.ipa        the standard app: weight logged by hand, no Bluetooth (for other people / the App Store)
#   Omnifit-Scale.ipa  the owner's own: adds weighing with their Renpho Bluetooth scale
name: Build the .ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Omnifit
            scale: false
          - file: Omnifit-Scale
            scale: true
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the app's packages
        run: npm ci

      - name: Choose the version (with or without the Bluetooth scale)
        run: |
          echo '{ "scale": ${{ matrix.scale }} }' > variant.json
          cat variant.json

      - name: Make the Xcode project (Expo prebuild, installs the pods)
        run: |
          npx expo prebuild --platform ios --clean
          echo "Bluetooth library in this build:"; grep -c "react-native-ble-plx" ios/Podfile.lock || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          brew install xcbeautify
          xcodebuild -workspace ios/Omnifit.xcworkspace -scheme Omnifit -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Pack the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Omnifit.app Payload/
          # The build number, so each install shows which build it is.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Payload/Omnifit.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.${{ github.run_number }}" Payload/Omnifit.app/Info.plist
          zip -qry "${{ matrix.file }}.ipa" Payload
          ls -lh "${{ matrix.file }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}.ipa

      - name: Keep the log of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-build-log
          path: build.log

  # Publishes whichever versions built, as one Release with both files.
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -lh out

      - name: Publish the .ipa files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.ipa
          fail_on_unmatched_files: true
          make_latest: ${{ needs.build.result == 'success' && 'true' || 'false' }}

      - name: Publish the log of a failed build
        if: failure() || needs.build.result != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Last failed build's log
          prerelease: true
          files: out/build.log
